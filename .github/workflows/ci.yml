name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint JS (ESLint)
        run: npm run lint

      - name: Lint extension (web-ext)
        run: npx web-ext lint --self-hosted

      - name: Build XPI
        run: npm run build

      - name: Audit dependencies
        # Advisories tolerated until a fixed release exists:
        # - GHSA-86w9-cpqp-85rv: node-forge <=1.4.0, dev-only (web-ext > @devicefarmer/adbkit), not shipped in the XPI
        env:
          IGNORED_ADVISORIES: '["GHSA-86w9-cpqp-85rv"]'
        run: |
          remaining=$({ npm audit --json || true; } | jq -r --argjson ignored "$IGNORED_ADVISORIES" \
            '[.vulnerabilities[].via[] | objects | select(.severity == "high" or .severity == "critical") | .url | sub(".*/"; "")] | unique - $ignored | .[]')
          if [ -n "$remaining" ]; then
            echo "::error::Unignored high/critical advisories: $remaining"
            npm audit --audit-level=high
            exit 1
          fi
          echo "No unignored high/critical advisories."
