name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Lint et build sans droit d'écriture : les dépendances npm ne voient jamais de token en écriture
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint JS (ESLint)
        run: npm run lint

      - name: Lint extension (web-ext)
        run: npx web-ext lint --self-hosted

      - name: Build XPI
        run: npm run build

      - name: Publier le XPI comme artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cleanmailbox-xpi
          path: cleanmailbox.xpi
          if-no-files-found: error
          retention-days: 1

  # Publication : aucun npm ci ici, uniquement des modules Node natifs
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Récupérer le XPI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cleanmailbox-xpi

      - name: Extraire la version depuis le tag
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: echo "VERSION=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Mettre à jour updates.json
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: node scripts/generate-update-manifest.js "$VERSION" cleanmailbox.xpi

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: cleanmailbox.xpi
          generate_release_notes: true

      - name: Configurer git pour le commit de retour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commiter updates.json sur main
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          git add updates.json
          git diff --cached --quiet || git commit -m "chore: update updates.json for v${VERSION} [skip ci]"
          git push origin main
