<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title data-i18n="optionsTitle">Configuration CleanMailbox</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="email"], input[type="password"], select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #0060df;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #003eaa;
    }
    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <h1 data-i18n="optionsTitle">Configuration CleanMailbox</h1>
  <form id="configForm">
    <div class="form-group">
      <label for="email" data-i18n="optionsEmailLabel">Votre adresse email :</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="form-group">
      <label for="apiKey" data-i18n="optionsApiKeyLabel">Clé API :</label>
      <input type="password" id="apiKey" name="apiKey" required>
    </div>
    <div class="form-group">
      <label for="locale" data-i18n="optionsLocaleLabel">Langue :</label>
      <select id="locale" name="locale">
        <option value="fr" data-i18n="localeFr">Français</option>
        <option value="en" data-i18n="localeEn">English</option>
      </select>
    </div>
    <button type="submit" data-i18n="optionsSaveButton">Enregistrer la configuration</button>
  </form>
  <div id="status" class="status" style="display: none;"></div>
  <script src="options.js" type="module"></script>
</body>
</html>
